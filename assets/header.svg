    <text x="63" y="190" xml:space="preserve">
db    db d888888b d8b   db d888888b  .o88b. d888888b db    db .d8888.
    </text>

    <text x="63" y="212" xml:space="preserve">
88    88   `88'   888o  88   `88'   d8P  Y8   `88'   88    88 88'  YP
    </text>

    <text x="63" y="234" xml:space="preserve">
Y8    8P    88    88V8o 88    88    8P         88    88    88 `8bo.
    </text>

    <text x="63" y="256" xml:space="preserve">
`8b  d8'    88    88 V8o88    88    8b         88    88    88   `Y8b.
    </text>

    <text x="63" y="278" xml:space="preserve">
 `8bd8'    .88.   88  V888   .88.   Y8b  d8   .88.   88b  d88 db   8D
    </text>

    <text x="63" y="300" xml:space="preserve">
   YP    Y888888P VP   V8P Y888888P  `Y88P' Y888888P ~Y8888P' `8888Y'
    </text>

  </g>


