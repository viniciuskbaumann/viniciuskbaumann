<svg
  width="1200"
  height="390"
  viewBox="0 0 1200 390"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- FUNDO -->
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="390">
      <stop offset="0%" stop-color="#05070D"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#080510"/>
    </linearGradient>

    <!-- GRADIENTE PRINCIPAL -->
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">

      <stop offset="0%" stop-color="#00E5FF">
        <animate
          attributeName="stop-color"
          values="#00E5FF;#C084FC;#39FF14;#00E5FF"
          dur="6s"
          repeatCount="indefinite"
        />
      </stop>

      <stop offset="50%" stop-color="#C084FC">
        <animate
          attributeName="stop-color"
          values="#C084FC;#39FF14;#00E5FF;#C084FC"
          dur="6s"
          repeatCount="indefinite"
        />
      </stop>

      <stop offset="100%" stop-color="#39FF14">
        <animate
          attributeName="stop-color"
          values="#39FF14;#00E5FF;#C084FC;#39FF14"
          dur="6s"
          repeatCount="indefinite"
        />
      </stop>

    </linearGradient>


    <!-- GLOW -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>


    <filter id="softGlow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>


    <!-- GRID -->
    <pattern
      id="grid"
      width="32"
      height="32"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M32 0H0V32"
        fill="none"
        stroke="#00E5FF"
        stroke-opacity="0.055"
        stroke-width="1"
      />
    </pattern>


    <!-- SCANLINES -->
    <pattern
      id="scanlines"
      width="4"
      height="4"
      patternUnits="userSpaceOnUse"
    >
      <rect
        width="4"
        height="1"
        fill="#FFFFFF"
        opacity="0.018"
      />
    </pattern>


    <!-- CLIP -->
    <clipPath id="terminalClip">
      <rect
        x="20"
        y="20"
        width="1160"
        height="350"
        rx="13"
      />
    </clipPath>

  </defs>


  <!-- BACKGROUND -->

  <rect
    width="1200"
    height="390"
    fill="#05070D"
  />

  <rect
    x="20"
    y="20"
    width="1160"
    height="350"
    rx="13"
    fill="url(#background)"
    stroke="#212936"
    stroke-width="1"
  />


  <!-- GRID -->

  <rect
    x="20"
    y="20"
    width="1160"
    height="350"
    rx="13"
    fill="url(#grid)"
    clip-path="url(#terminalClip)"
  />


  <!-- SCANLINES -->

  <rect
    x="20"
    y="20"
    width="1160"
    height="350"
    fill="url(#scanlines)"
    clip-path="url(#terminalClip)"
  />


  <!-- NEON SUPERIOR -->

  <rect
    x="20"
    y="20"
    width="1160"
    height="2"
    rx="1"
    fill="url(#neon)"
    filter="url(#glow)"
  />


  <!-- TERMINAL BAR -->

  <rect
    x="20"
    y="22"
    width="1160"
    height="42"
    fill="#090D13"
  />

  <line
    x1="20"
    y1="64"
    x2="1180"
    y2="64"
    stroke="#1D2633"
  />

  <circle cx="44" cy="43" r="5" fill="#FF5F57"/>
  <circle cx="62" cy="43" r="5" fill="#FEBC2E"/>
  <circle cx="80" cy="43" r="5" fill="#28C840"/>

  <text
    x="105"
    y="48"
    font-family="monospace"
    font-size="13"
    fill="#6E7681"
  >
    vinicius@github — bash
  </text>


  <!-- STATUS DIREITA -->

  <circle
