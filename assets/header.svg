    y="316"
    width="9"
    height="15"
    fill="#00E5FF"
    filter="url(#softGlow)"
  >
    <animate
      attributeName="opacity"
      values="1;1;0;0"
      dur="1s"
      repeatCount="indefinite"
    />
  </rect>


  <!-- LINHA INFERIOR -->

  <rect
    x="45"
